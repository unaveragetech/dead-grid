<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Grid changelog</title>
<meta name="description" content="Every Dead Grid release with notes, sizes, checksums and download links.">
<meta name="theme-color" content="#0d0f0c">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="wrap">
  <div class="pagehead">
    <span class="kicker">Changelog</span>
    <h1>What changed, release by release</h1>
    <p class="lead">Newest first. Updates install over the old version and keep your data.</p>
    <div class="filter"><input class="search" id="q" type="search" placeholder="Search the changelog..."><span class="pill green" id="count"></span></div>
  </div>
  <div id="list"><div class="rel"><div class="md"><p>Loading...</p></div></div></div>
</div>
</main>
<div id="site-footer"></div>
<script src="site.js"></script>
<script>
(function () {
  var S = window.Site, all = [];
  function title(r) {
    var l = (r.notes || "").split(/\r?\n/).filter(function (x) { return /^##?\s/.test(x) && !/^###/.test(x); })[0];
    return l ? l.replace(/^#+\s*/, "") : "Version " + r.version;
  }
  function paint() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var list = all.filter(function (r) { return !q || (r.notes || "").toLowerCase().indexOf(q) >= 0 || r.version.indexOf(q) >= 0; });
    document.getElementById("count").textContent = list.length + " of " + all.length + " releases";
    document.getElementById("list").innerHTML = list.map(function (r) {
      var isNew = all[0] === r;
      return '<article class="rel" id="v' + r.version + '"><header><h2>' + S.esc(title(r)) + (isNew ? '<span class="tag">latest</span>' : "") + '</h2><span class="meta">v' + S.esc(r.version) + " &middot; build " + (r.versionCode || "?") + (r.date ? " &middot; " + S.fmtDate(r.date) : "") + "</span></header>" +
        '<div class="md">' + S.md(r.notes) + "</div>" +
        '<div class="files"><a class="btn small primary" href="' + r.download + '">APK &middot; ' + S.fmtSize(r.size) + '</a><a class="btn small" href="' + r.url + '">GitHub release</a></div>' +
        '<details><summary>Checksum</summary><p style="word-break:break-all;font:12px ui-monospace,monospace">SHA-256<br>' + S.esc(r.sha256) + "</p></details></article>";
    }).join("") || '<div class="rel"><div class="md"><p>Nothing matches that.</p></div></div>';
    if (location.hash && !q) { var e = document.getElementById(location.hash.slice(1)); if (e) e.scrollIntoView(); }
  }
  S.releases().then(function (l) { all = l; paint(); document.getElementById("q").addEventListener("input", paint); })
    .catch(function () { document.getElementById("list").innerHTML = '<div class="rel"><div class="md"><p>Couldn\'t load the changelog. See the GitHub releases page.</p></div></div>'; });
})();
</script>
</body>
</html>
